<!DOCTYPE html>
<html>
<head>

<title>tmcf3x messager</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h2>ducki's http message sender</h2>

<div class="container">

    <input
        id="msg"
        placeholder="enter msg here..."
    >

    <button onclick="send()">
        Send
    </button>

    <p id="status"></p>

</div>

<script>

async function send(){

    const message=document.getElementById("msg").value.trim();
    const status=document.getElementById("status");

    if(!message){

        status.textContent="Enter a message first.";

        return;
    }

    status.textContent="Sending...";

    try{

        const response=await fetch("/announcement",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:message
            })

        });

        const data=await response.json();

        if(data.success){

            status.textContent=
                `Sent! Message #${data.id} | ${data.messagesWaiting} waiting`;

            document.getElementById("msg").value="";

        }else{

            status.textContent=
                data.error||"Failed to send message.";

        }

    }catch(error){

        console.error(error);

        status.textContent=
            "Could not connect to the server.";

    }

}

</script>

</body>
</html>
